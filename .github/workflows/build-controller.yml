name: UAPC NM Controller APK (public runner)
on:
  push:
    branches: [main]
    paths:
      - 'controller/**'
      - '.github/workflows/build-controller.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Verify UAPC controller APK
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate controller source generator
        run: |
          python3 -m py_compile controller/generate.py
          python3 controller/generate.py
          test -f generated-controller/app/src/main/AndroidManifest.xml
          test -f generated-controller/app/src/main/java/my/nm/uapc/MainActivity.java
      - name: Check Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android APK
        run: |
          set -o pipefail
          cd generated-controller
          gradle :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee ../controller-build.log
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2
          from builder.verify import verify_apk
          import json
          root = Path("generated-controller/app/build/outputs/apk")
          candidates = sorted(root.rglob("*.apk")) if root.exists() else []
          print("APK candidates:", [(str(p), p.stat().st_size) for p in candidates], flush=True)
          if not candidates:
              raise SystemExit("No APK generated by Gradle")
          apk = max(candidates, key=lambda p: p.stat().st_size)
          dest = Path("output/UAPC-NM-Controller.apk")
          copy2(apk, dest)
          result = verify_apk(dest)
          Path("output/controller-build-report.json").write_text(json.dumps(result, indent=2)+"\\n")
          print("APK_VERIFIED", json.dumps(result), flush=True)
          PY
      - name: Publish diagnostic log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UAPC-Controller-Build-Diagnostics
          path: |
            controller-build.log
            output/verification.log
            output/UAPC-NM-Controller.apk
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UAPC-NM-Controller-APK
          path: output/*
          retention-days: 7
          if-no-files-found: error

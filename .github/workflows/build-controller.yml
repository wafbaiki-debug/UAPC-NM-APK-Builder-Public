name: UAPC NM Controller APK (public runner)
on:
  push:
    branches: [main]
    paths:
      - 'controller/**'
      - '.github/workflows/build-controller.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Verify UAPC controller APK
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate public controller source
        run: python3 controller/generate.py
      - name: Compile Android APK
        run: |
          set -o pipefail
          cd generated-controller
          gradle :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee ../controller-build.log
      - name: Verify and package
        run: |
          mkdir -p output
          cp generated-controller/app/build/outputs/apk/debug/app-debug.apk output/UAPC-NM-Controller.apk
          python3 builder/verify.py output/UAPC-NM-Controller.apk --output output/controller-build-report.json
      - name: Publish diagnostic log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UAPC-Controller-Build-Diagnostics
          path: controller-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: UAPC-NM-Controller-APK
          path: output/*
          retention-days: 7
          if-no-files-found: error
